# =============================================================================
# VaxForge — Merkezi Eşik / Cut-off Yapılandırması
# -----------------------------------------------------------------------------
# İLKE: Pipeline'daki HİÇBİR araç kod içinde gömülü sabit (magic number)
# kullanmaz. Her eşik burada tanımlıdır: varsayılan + açıklama + geçerli aralık +
# organizmaya özel değerler. Doğru eşik organizmaya göre değişir; bu yüzden her
# aracın 'defaults' bölümünde bakteri / virüs / parazit için ayrı değer vardır.
#
# hard_filter: true  -> eşiği geçemeyen aday TAMAMEN elenir (sert filtre)
# hard_filter: false -> eşik yalnızca skorlamaya/sıralamaya girer (yumuşak)
# =============================================================================

meta:
  version: 1
  name: "VaxForge threshold config"
  profiles: [bacteria, virus, parasite]
  default_profile: bacteria

tools:

  # --- 2) Keşif: küratörlü virülans DB'lerine benzerlik taraması --------------
  discovery_vfdb:
    step: discovery
    engine: "diamond/blastp -> VFDB, Victors, BV-BRC"
    description: "Proteomu küratörlü virülans faktörü DB'lerine tarar. SKORLAMA özelliğidir (NERVE2 gibi) — sert kapı DEĞİL: VFDB'de olmayan gerçek yüzey antijenlerini (ör. NHBA) elemez; virülans kanıtı adaylık puanına bileşen olur. Eleme lokalizasyon/TM/homoloji funnel'ında yapılır."
    hard_filter: false
    params:
      evalue:       { default: {bacteria: 1.0e-5, virus: 1.0e-5, parasite: 1.0e-4}, range: [1.0e-30, 1.0e-2], desc: "Maksimum e-value" }
      min_identity: { default: {bacteria: 30, virus: 25, parasite: 30}, range: [10, 100], unit: "%", desc: "Minimum dizi kimliği" }
      min_coverage: { default: {bacteria: 50, virus: 40, parasite: 50}, range: [10, 100], unit: "%", desc: "Minimum hizalama kapsamı" }

  # --- 3) Antijen eleme hunisi -----------------------------------------------
  localization:
    step: antigen_funnel
    engine: "PSORTb / DeepLoc"
    description: "Hücre-altı lokalizasyon; erişilebilir (yüzey/salgı) proteinler tercih. Sitoplazmik elenir."
    hard_filter: true
    params:
      allowed:
        default:
          bacteria: [extracellular, outer_membrane, cell_wall, periplasm]
          virus:    [surface, envelope, membrane]
          parasite: [extracellular, plasma_membrane, secreted, gpi_anchored]
        desc: "Kabul edilen lokalizasyonlar (dışındakiler elenir). Bakteri listesi Gram-NEGATİF mimariye göredir."
      allowed_gram_positive:
        default:
          bacteria: [extracellular, cell_wall, membrane]
          virus:    [surface, envelope, membrane]
          parasite: [extracellular, plasma_membrane, secreted, gpi_anchored]
        desc: "Gram-POZİTİF bakteride kabul edilen lokalizasyonlar. Gram(+)'de dış zar yoktur; sitoplazmik zar hücrenin dış sınırıdır ve yüzeye çıkan proteinler PSORTb'de 'Cytoplasmic Membrane' (→ membrane) etiketi alır. Gömülü çok-sarmallı proteinleri transmembrane.max_helices ayıklamaya devam eder."

  signal_peptide:
    step: antigen_funnel
    engine: "SignalP / DeepSig"
    description: "Sinyal peptidi varlığı olasılığı; salgı/yüzey yolunu doğrular."
    hard_filter: false
    params:
      min_probability: { default: {bacteria: 0.5, virus: 0.5, parasite: 0.5}, range: [0.0, 1.0], desc: "Minimum sinyal peptidi olasılığı" }

  transmembrane:
    step: antigen_funnel
    engine: "DeepTMHMM"
    # KALİBRASYON (2026-10-18): kapı uzunluk- ve sınıf-eşli kontrol setlerinde ölçüldü.
    # Pozitif = 5 Gram(+) türün deneysel doğrulanmış antijenleri, GERÇEK PSORTb ile
    # lokalizasyon kapısını geçenler (n=25, karışım bileşenleri dahil — yapısal soru).
    # Negatif = aynı proteomlardan YALNIZ anotasyonla seçilmiş çok-geçişli integral
    # membran proteinleri (taşıyıcı/permeaz/PTS/efluks), uzunluk eşli (n=102).
    # Sonuç: sinyal-duyarlı kural mevcut kuralı KESİN DOMİNE etti —
    #   TM<=1          : duyarlılık 24/25 (%96.0), özgüllük 89/102 (%87.3)
    #   sinyal-duyarlı : duyarlılık 25/25 (%100),  özgüllük 89/102 (%87.3)  <- seçilen
    #   TM<=2          : duyarlılık %100, özgüllük %86.3 (1 puan daha kötü)
    # Mekanizma öngörülmüştü: Gram(+) duvar-çapalı yüzey proteini N-ucunda sinyal
    # peptidi, C-ucunda LPXTG/membran çapası taşır; sayıcı ikisini iki sarmal sayınca
    # tam hedeflenen sınıf eleniyordu (S. suis SspA, TM=2, cell_wall 9.98, SignalP 0.77).
    # Kazanç tek antijene dayanıyor (n=1) AMA özgüllük kaybı SIFIR → ölçülen hiçbir
    # eksende bedeli yok. Veri: benchmark/results/tm_gate_calibration.json
    description: "Transmembran heliks sayısı; rekombinant üretilebilirlik için düşük tutulur. Sinyal peptidi(+) proteinlerde ilk sarmal sayılmaz (salgı sinyali, membran çapası değil) — kalibrasyonla doğrulandı."
    hard_filter: true
    params:
      max_helices: { default: {bacteria: 1, virus: 1, parasite: 1}, range: [0, 5], desc: "İzin verilen maksimum TM heliks sayısı" }
      signal_peptide_aware:
        default: {bacteria: true, virus: true, parasite: true}
        desc: "true ise sinyal peptidi(+) proteinde etkin TM = TM - 1 (ilk sarmal salgı sinyalidir, membran çapası değil). Kalibrasyonla seçildi; false mevcut-öncesi davranışa döner."

  human_homology:
    step: antigen_funnel
    engine: "diamond blastp -> konak proteom(lar)ı"
    # KALİBRASYON (2026-10-10): protein-bütünü kimlik, epitop-düzeyi otoimmünite
    # riskinin VEKİLİ DEĞİL. S. suis'te ölçüldü: enolaz protein-bütününde insana
    # %49.8 benzer ama 9-mer'lerinin yalnız %1.9'u insan self-peptidiyle birebir
    # aynı (GAPDH %2.1, gnd %3.0, DnaJ %1.4). Sert eleme, 8 riskli 9-mer için
    # 419 self-olmayan epitobu da atıyordu. Risk artık doğru granülaritede
    # kapatılıyor: burada YUMUŞAK (skor cezası), epitop düzeyinde SERT
    # (molecular_mimicry). Veri: benchmark/results/homology_granularity.json
    description: "Otoimmünite güvenliği (protein düzeyi): konağa benzeyen aday ELENMEZ, işaretlenir + skor cezası alır. Sert eleme epitop düzeyinde molecular_mimicry kapısında yapılır."
    hard_filter: false
    params:
      evalue:       { default: {bacteria: 1.0e-4, virus: 1.0e-4, parasite: 1.0e-4}, range: [1.0e-20, 1.0e-1], desc: "Konak hit'i için maksimum e-value" }
      min_identity: { default: {bacteria: 35, virus: 35, parasite: 35}, range: [20, 100], unit: "%", desc: "Bu kimliğin ÜSTÜ konak-benzeri sayılır -> işaretlenir (eleme YOK)" }
      hard_discard_identity: { default: {bacteria: 90, virus: 90, parasite: 90}, range: [35, 100], unit: "%", desc: "Bu kimliğin ÜSTÜ konak proteininin kendisi sayılır -> elenir (ortolog/kontaminasyon güvenliği)" }
      homology_penalty: { default: {bacteria: 0.75, virus: 0.75, parasite: 0.75}, range: [0.1, 1.0], desc: "Konak-benzeri işaretli antijenin adaylık puanı bu katsayıyla çarpılır; mimikri/toksisite cezasından daha ağır, çünkü risk protein bütününe yayılı." }

  antigenicity_vaxijen:
    step: antigen_funnel
    engine: "VaxiJen (organizmaya özel model)"
    description: "Tahmini antijenite skoru; VaxiJen modeli organizmaya göre seçilir."
    hard_filter: false
    params:
      threshold: { default: {bacteria: 0.4, virus: 0.4, parasite: 0.5}, range: [0.0, 1.0], desc: "Antijenik sayılma eşiği" }
      model:     { default: {bacteria: bacteria, virus: virus, parasite: parasite}, desc: "Kullanılacak VaxiJen modeli" }

  conservation:
    step: antigen_funnel
    engine: "suşlar arası MSA"
    description: "Suşlar arası korunmuşluk; geniş koruma için yüksek istenir."
    hard_filter: false
    params:
      min_percent: { default: {bacteria: 80, virus: 70, parasite: 80}, range: [0, 100], unit: "%", desc: "Minimum korunmuşluk" }

  adhesin:
    step: antigen_funnel
    engine: "SPAAN / Vaxign"
    description: "Adezin olma olasılığı; yapışma proteinleri iyi hedeftir."
    hard_filter: false
    params:
      min_probability: { default: {bacteria: 0.51, virus: 0.51, parasite: 0.51}, range: [0.0, 1.0], desc: "Minimum adezin olasılığı" }

  molecular_mimicry:
    step: epitope
    engine: "konak self-proteom k-mer tam eşleşme"
    # KALİBRASYON (2026-10-10, n=1000): insan self k-mer'lerinde %100 yakalama,
    # DENEYSEL DOĞRULANMIŞ IEDB epitoplarında %1.3 (9-mer) / %1.7 (15-mer)
    # yanlış-pozitif → epitop düzeyinde SERT eleme güvenli. Aynı kural tam
    # proteine ASLA uygulanmaz: rastgele non-toksin proteinlerin %66.3'ünü
    # işaretliyor. Veri: benchmark/results/filter_calibration.json
    description: "Epitop-seviyesi moleküler mimikri: konağın kendi proteininde birebir aynı geçen epitop merkezi tolerans/otoimmünite riski taşır → SERT (elenir). Protein düzeyi homoloji artık yumuşak; otoimmünite güvenliği bu kapıda."
    hard_filter: true
    params:
      k: { default: {bacteria: 9, virus: 9, parasite: 9}, range: [7, 15], desc: "Konak self ile aranan tam-eşleşme uzunluğu (MHC-I çekirdeği=9)" }
      discard_exact_match: { default: {bacteria: true, virus: true, parasite: true}, desc: "Konak self ile TAM eşleşen epitop elenir (kalibrasyon: doğrulanmış epitoplarda %1.3 YP)" }
      near_match_penalty: { default: {bacteria: 0.9, virus: 0.9, parasite: 0.9}, range: [0.1, 1.0], desc: "Tam eşleşme değil ama BLOSUM-yakın epitop: elenmez, skoru bu katsayıyla çarpılır (TCR dejenerasyonu)" }

  # --- 4) Epitop tahmini ------------------------------------------------------
  bcell_epitope:
    step: epitope
    engine: "BepiPred-3.0"
    description: "Lineer B-hücre epitobu tahmini (sliding-window)."
    hard_filter: false
    params:
      min_score:  { default: {bacteria: 0.5, virus: 0.5, parasite: 0.5}, range: [0.0, 1.0], desc: "Minimum epitop skoru" }
      min_length: { default: {bacteria: 8, virus: 8, parasite: 8}, range: [6, 30], unit: "aa", desc: "Minimum epitop uzunluğu" }

  mhc_class_i:
    step: epitope
    engine: "MHCflurry / NetMHCpan (çok-organizmalı panel)"
    description: "MHC-I bağlanma (T-hücre CTL). %rank ile güçlü/zayıf bağlayıcı ayrımı."
    hard_filter: false
    params:
      peptide_lengths: { default: {bacteria: [8,9,10,11], virus: [8,9,10,11], parasite: [8,9,10,11]}, desc: "Taranacak peptit uzunlukları" }
      rank_strong:     { default: {bacteria: 0.5, virus: 0.5, parasite: 0.5}, range: [0.0, 5.0], unit: "%rank", desc: "Güçlü bağlayıcı eşiği" }
      rank_weak:       { default: {bacteria: 2.0, virus: 2.0, parasite: 2.0}, range: [0.0, 10.0], unit: "%rank", desc: "Zayıf bağlayıcı eşiği" }

  netctl:
    step: epitope
    engine: "NetCTL-1.2 (proteozomal kesim + TAP)"
    description: "MHC-I sonrası antijen işleme: allel-bağımsız C-terminal kesim (cle) + TAP taşıma. NetCTL'in kendi eski MHC tahmincisi KULLANILMAZ (bağlanmayı NetMHCpan yapar)."
    hard_filter: false
    params:
      min_cleavage: { default: {bacteria: 0.5, virus: 0.5, parasite: 0.5}, range: [0.0, 1.0], desc: "Etkin proteozomal C-terminal kesim eşiği (bilgi amaçlı; sert filtre değil)" }

  mhc_class_ii:
    step: epitope
    engine: "NetMHCIIpan (çok-organizmalı panel)"
    description: "MHC-II bağlanma (T-hücre HTL)."
    hard_filter: false
    params:
      peptide_length: { default: {bacteria: 15, virus: 15, parasite: 15}, range: [11, 25], unit: "aa", desc: "Peptit uzunluğu (core 9)" }
      rank_strong:    { default: {bacteria: 2.0, virus: 2.0, parasite: 2.0}, range: [0.0, 10.0], unit: "%rank", desc: "Güçlü bağlayıcı eşiği" }
      rank_weak:      { default: {bacteria: 10.0, virus: 10.0, parasite: 10.0}, range: [0.0, 20.0], unit: "%rank", desc: "Zayıf bağlayıcı eşiği" }

  ifn_gamma:
    step: epitope
    engine: "IFNepitope2 (ExtraTrees + BLAST, Dhall 2024)"
    description: "MHC-II sonrası: HTL epitobunun IFN-γ (Th1) salgılatma yeteneği. Yalnız insan/fare modeli var; diğer konaklarda atlanır. Güncel çok-epitoplu aşı literatüründe standart HTL seçim ölçütü."
    hard_filter: false
    params:
      threshold: { default: {bacteria: 0.49, virus: 0.49, parasite: 0.49}, range: [0.0, 1.0], desc: "IFN-γ indükleyici sayılma eşiği (ml+BLAST toplam skoru)" }

  # --- 5) Sağ kalım elemesi ---------------------------------------------------
  allergenicity:
    step: survival
    engine: "FAO/WHO 6-mer (UniProt alerjen DB)"
    description: "Alerjen tahmini; alerjen adaylar elenir. Sert filtre. KALİBRASYON (2026-10-10, benchmark/calibrate_filters.py): 9-mer'de yanlış-pozitif ~%2-3, 15-mer'de ~%7 → epitop uzunluğunda sert filtre olarak kullanılabilir. UYARI: aynı kural TAM PROTEİNDE non-alerjen proteinlerin ~%95'ini işaretler (6-mer kuralının bilinen özgüllük sorunu) — protein/MEV düzeyine UYGULANMAZ."
    hard_filter: true
    params:
      require_non_allergen: { default: {bacteria: true, virus: true, parasite: true}, desc: "Sadece non-alerjenler geçer" }

  toxicity:
    step: survival
    engine: "ToxinPred3 (peptit düzeyi) / ToxinPred2 (protein + MEV düzeyi)"
    description: >-
      Toksisite tahmini. EPİTOP DÜZEYİNDE YUMUŞAK: tek bir 9-mer'in toksisitesi
      için altın standart yoktur (toksisite katlanmış proteinin işlevidir), bu
      yüzden işaretleme skora yansıtılır, eleme yalnız yüksek-güven eşiğinin
      üstünde yapılır. Sert eleme araçların kendi uzunluk sınıfında, yani protein
      ve nihai MEV konstruktu düzeyinde korunur (mev.py, ToxinPred2 hibrit).
      KALİBRASYON (2026-10-10): ToxinPred2 Model 2 ile 0.6 eşiği 9-mer'lerde insan
      self peptitlerinin %74'ünü, doğrulanmış IEDB epitoplarının %78'ini "toksik"
      işaretliyordu (influenza M1 58-66 GILGFVFTL dahil) — epitop aşaması rastgele
      bir 4'te-3 kırımına dönüşmüştü. ToxinPred3 ExtraTrees peptit düzeyi için
      eğitilmiştir ve aynı setlerde yanlış-pozitif oranı eşik 0.7'de ~%2-4'e düşer.
    hard_filter: false
    params:
      max_toxicity_score: { default: {bacteria: 0.6, virus: 0.6, parasite: 0.6}, range: [0.0, 1.0], desc: "YUMUŞAK işaretleme eşiği. Üstü 'toksik işaretli' sayılır, ELENMEZ; adaylık puanı toxicity_penalty ile çarpılır. 0.6, eşik taramasında doğrulanmış IEDB epitoplarında yanlış-pozitifi ≤%5'e indiren değerdir (9-mer %4.5, 15-mer %4.9). Yazar varsayılanı 0.38 genel peptit-ilaç taraması içindir; orada yanlış işaretleme ucuz, bizde doğrulanmış epitopların %22'sini cezalandırıyordu." }
      hard_discard_score:  { default: {bacteria: 0.85, virus: 0.85, parasite: 0.85}, range: [0.0, 1.0], desc: "YÜKSEK-GÜVEN eleme eşiği; yalnız bunun üstü elenir. Eleme geri alınamaz olduğu için ölçüt daha katı: doğrulanmış IEDB epitoplarında yanlış-pozitif ≤%0.5 (9-mer %0.2, 15-mer %0.6), insan self 9-mer %1.8. Bkz. benchmark/FILTER_CALIBRATION.md." }
      toxicity_penalty:    { default: {bacteria: 0.9, virus: 0.9, parasite: 0.9}, range: [0.1, 1.0], desc: "Toksik işaretli peptidin adaylık puanı bu katsayıyla çarpılır (moleküler mimikri cezasıyla aynı mantık)." }

  population_coverage:
    step: survival
    engine: "IEDB Population Coverage"
    description: "Seçilen epitop setinin popülasyon/tür kapsamı."
    hard_filter: false
    params:
      min_percent: { default: {bacteria: 90, virus: 90, parasite: 85}, range: [0, 100], unit: "%", desc: "Minimum kapsam" }

  # --- 6d) IEDB literatür/bilinen-epitop taraması -----------------------------
  iedb_match:
    step: iedb_match
    engine: "IEDB IQ-API (query-api.iedb.org)"
    description: "Aday peptitleri deneysel doğrulanmış epitoplarla (IEDB) eşleştirir; eşleşme pozitif kontrol/literatür sinyalidir. SALT YORUM — adaylık puanını değiştirmez. Organizma taxon'u verilirse recall benchmark hesaplanır."
    hard_filter: false
    params:
      min_overlap: { default: {bacteria: 8, virus: 8, parasite: 8}, range: [6, 15], unit: "aa", desc: "Minimum ortak çekirdek (exact/içerme dışı örtüşme için)" }

  # --- 6) Yapı + docking/MD ---------------------------------------------------
  structure_plddt:
    step: structure
    engine: "AlphaFold (peptit-MHC kompleksi)"
    description: "Yapı güven skoru; düşük pLDDT güvenilmez model demektir."
    hard_filter: false
    params:
      min_plddt: { default: {bacteria: 70, virus: 70, parasite: 70}, range: [0, 100], desc: "Minimum ortalama pLDDT" }

  docking_md:
    step: structure
    engine: "HADDOCK/AutoDock + GROMACS MD"
    description: "Peptit-MHC bağlanma serbest enerjisi / kararlılık (ağır, GPU)."
    hard_filter: false
    params:
      max_binding_energy: { default: {bacteria: -6.0, virus: -6.0, parasite: -6.0}, range: [-15.0, 0.0], unit: "kcal/mol", desc: "Bu değerin ALTI iyi bağlanma" }

  # --- 7) mRNA konstrüktü -----------------------------------------------------
  mrna_construct:
    step: mrna
    engine: "kodon optimizasyonu + RNAfold + ProtParam"
    description: "mRNA konstrükt doğrulama eşikleri (insan-kodon optimizasyonu)."
    hard_filter: false
    params:
      gc_min:            { default: {bacteria: 40, virus: 40, parasite: 40}, range: [20, 80], unit: "%", desc: "Minimum GC" }
      gc_max:            { default: {bacteria: 70, virus: 70, parasite: 70}, range: [20, 80], unit: "%", desc: "Maksimum GC" }
      min_cai:           { default: {bacteria: 0.8, virus: 0.8, parasite: 0.8}, range: [0.0, 1.0], desc: "Minimum Codon Adaptation Index (insan)" }
      max_instability:   { default: {bacteria: 40, virus: 40, parasite: 40}, range: [0, 100], desc: "ProtParam kararsızlık indeksi üst sınırı" }

# =============================================================================
# Adaylık puanı: hayatta kalan her peptidin metriklerini tek ağırlıklı skora
# indirger. Ağırlıklar toplamı 1.0 olacak şekilde normalize edilir.
# =============================================================================
candidacy_score:
  description: "En güçlü peptit adaylarını sıralayan birleşik skor. Yalnızca GERÇEK sonuç üreten analizler dahildir."
  weights:
    antigenicity:        0.20   # IApred (kaynak protein)
    virulence:           0.10   # VFDB virülans kanıtı (NERVE2 gibi skor; sert kapı değil)
    mhc_i_binding:       0.20   # MHC-I %rank (NetMHCpan)
    mhc_ii_binding:      0.18   # MHC-II %rank (NetMHCIIpan)
    organism_coverage:   0.14   # kaç konak allelinde/konakta sunuluyor
    immunogenicity:      0.12   # CD8+ T-hücre immünojenite (IEDB Calis 2013, yalnız MHC-I)
    antigen_processing:  0.12   # proteozomal kesim + TAP (NetCTL-1.2, yalnız MHC-I)
    ifn_gamma:           0.12   # IFN-γ (Th1) indükleme (IFNepitope2, yalnız MHC-II/HTL)
    conservation:        0.10   # suşlar arası korunmuşluk (yalnız kullanıcı ek suş verirse)
    surface_exposure:    0.12   # viral zarf/yüzey glikoproteini (SignalP+TM imzası; YALNIZ virüs profili)
  # Ağırlıklar peptit-başına MEVCUT bileşenler üzerinden yeniden normalize edilir
  # (scoring.py); bir bileşen yoksa (ör. suş verilmedi → konservasyon yok) skoru bozmaz.
  # KALDIRILDI: structural_quality (AlphaFold GPU'suz deferred) — GPU eklenince açılır.
